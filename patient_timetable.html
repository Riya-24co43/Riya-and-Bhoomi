<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahara - Caregiver Portal</title>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Font (Nunito) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-color: #f4f7f6;
      padding: 20px 10px;
    }

    .portal-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 20px 30px 20px;
      border: 1px solid #e5ecee;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      position: relative;
      min-height: 580px;
    }

    .portal-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: #0b6b80;
      cursor: pointer;
    }

    .portal-title {
      font-size: 24px;
      font-weight: 800;
      color: #0b6b80;
    }

    .schedule-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .schedule-title {
      font-size: 22px;
      font-weight: 800;
      color: #0b6b80;
      line-height: 1.1;
    }

    .new-task-btn {
      background-color: #fce881;
      color: #0b6b80;
      border: none;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease;
    }

    .new-task-btn:active {
      transform: scale(0.96);
    }

    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .schedule-card {
      background-color: #f0f3f5;
      border-radius: 18px;
      padding: 16px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      border-left: 4px solid transparent;
      transition: all 0.2s ease;
    }

    .schedule-card.accent-border {
      border-left-color: #0b6b80;
    }

    .time-badge {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .time-badge.teal {
      background-color: #0b6b80;
      color: #ffffff;
    }

    .time-badge.grey {
      background-color: #e2e7eb;
      color: #1e293b;
    }

    .time-badge .time-val {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
    }

    .time-badge .time-ampm {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .task-info {
      flex: 1;
      padding-right: 28px;
    }

    .task-heading {
      font-size: 16px;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.3;
    }

    .action-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: #ffffff;
      border: none;
      font-size: 14px;
      color: #64748b;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      cursor: pointer;
    }

    .loading-text, .empty-text {
      text-align: center;
      color: #64748b;
      padding: 30px 0;
      font-weight: 700;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-box {
      background: #ffffff;
      width: 90%;
      max-width: 340px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .modal-box h3 {
      color: #0b6b80;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save {
      background: #0b6b80;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <div class="portal-header">
      <button class="back-btn" id="backBtn" title="Back">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h2 class="portal-title">Caregiver Portal</h2>
    </div>

    <div class="schedule-bar">
      <h3 class="schedule-title">Quick<br>Schedule</h3>
      <button class="new-task-btn" id="newTaskBtn">
        <i class="fas fa-plus"></i> New Task
      </button>
    </div>

    <div class="schedule-list" id="scheduleList">
      <!-- Task cards loaded here dynamically -->
    </div>
  </div>

  <!-- Add/Edit Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-box">
      <h3 id="modalTitle">Add New Task</h3>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        
        <div class="form-group">
          <label for="taskDay">Day</label>
          <select id="taskDay">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
        </div>

        <div class="form-group">
          <label for="taskTime">Time</label>
          <input type="time" id="taskTime" required>
        </div>

        <div class="form-group">
          <label for="taskActivity">Activity</label>
          <input type="text" id="taskActivity" placeholder="Morning Medication" required>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn-save">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="patient_timetable.js"></script>
</body>
</html>
