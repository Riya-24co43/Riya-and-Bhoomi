<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahara - Daily Checklist</title>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Font (Nunito) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-color: #f4f7f6;
      padding: 20px 10px;
    }

    /* Mobile Card Container */
    .dashboard-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 20px 80px 20px;
      border: 1px solid #e5ecee;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      position: relative;
      overflow: hidden;
      min-height: 580px;
    }

    /* Header Nav */
    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: #1f8ea7;
      cursor: pointer;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #1f8ea7;
    }

    .profile-avatar-placeholder {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #e2e8f0;
      border: 2px solid #cbd5e1;
    }

    /* Section Title */
    .section-title {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .section-title i {
      color: #1f8ea7;
      font-size: 20px;
    }

    /* Checklist List & Cards */
    .checklist-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .checklist-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 18px 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.02);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .checklist-card.completed {
      background-color: #f8fafc;
      opacity: 0.75;
    }

    .checklist-card.completed .task-title {
      text-decoration: line-through;
      color: #94a3b8;
    }

    /* Square Checkbox */
    .square-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      flex-shrink: 0;
      transition: all 0.2s ease;
      background-color: #ffffff;
    }

    .checklist-card.completed .square-checkbox {
      background-color: #1f8ea7;
      border-color: #1f8ea7;
      color: #ffffff;
    }

    .task-content {
      flex: 1;
      padding-right: 32px;
    }

    .task-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .task-subtitle {
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
    }

    /* Right Category Icon */
    .task-side-icon {
      position: absolute;
      right: 18px;
      top: 22px;
      color: #00bcd4;
      font-size: 18px;
    }

    /* Bottom Nav Bar */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background-color: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      border-radius: 0 0 28px 28px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 16px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #64748b;
      gap: 4px;
      flex: 1;
      cursor: pointer;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item span {
      font-size: 13px;
      font-weight: 700;
    }

    .nav-item.active {
      color: #006677;
    }
  </style>
</head>
<body>

  <div class="dashboard-card">
    
    <!-- Header -->
    <div class="dashboard-header">
      <div class="header-left">
        <button class="back-btn" id="logoutBtn" title="Back/Logout">
          <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="brand-title">Sahara</h1>
      </div>
      <div class="profile-avatar-placeholder" id="profileAvatar"></div>
    </div>

    <!-- Title Section -->
    <div class="section-title">
      <i class="fas fa-list-check"></i>
      <span>My Daily Checklist</span>
    </div>

    <!-- Dynamic Container for Checklist Items -->
    <div class="checklist-list" id="checklistContainer">
      <!-- Tasks injected via JS -->
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="patient_home.html" class="nav-item">
        <i class="fas fa-house"></i>
        <span>Home</span>
      </a>
      <a href="patient_dashboard.html" class="nav-item">
        <i class="fas fa-gamepad"></i>
        <span>Games</span>
      </a>
      <a href="patient_checklist.html" class="nav-item active">
        <i class="fas fa-list-check"></i>
        <span>Checklist</span>
      </a>
    </nav>

  </div>

  <script src="checklist.js"></script>
</body>
</html>
