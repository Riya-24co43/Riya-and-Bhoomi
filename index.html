<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Sahara</title>

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Font (Nunito) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">

  <style>
    /* Reset & Fonts */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f7f6;
      padding: 20px;
    }

    /* Card Container with Soft Gradient Background */
    .welcome-card {
      width: 100%;
      max-width: 340px;
      background: linear-gradient(160deg, #fffdf2 0%, #ffffff 50%, #edf8fa 100%);
      border-radius: 24px;
      padding: 40px 28px 45px 28px;
      text-align: center;
      border: 1px solid #e5ecee;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
    }

    /* Logo Container */
    .logo-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Typography */
    .title {
      font-size: 26px;
      font-weight: 800;
      color: #0d1e25;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      font-weight: 600;
      color: #3b4e56;
      line-height: 1.45;
      margin-bottom: 36px;
    }

    /* Action Buttons */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 20px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn .icon {
      font-size: 18px;
    }

    /* Patient Button (Teal) */
    .btn-patient {
      background-color: #1f8ea7;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(31, 142, 167, 0.25);
    }

    .btn-patient:hover {
      background-color: #1a7a90;
    }

    /* Caregiver Button (Soft Yellow) */
    .btn-caregiver {
      background-color: #fee387;
      color: #1f8ea7;
      box-shadow: 0 4px 14px rgba(254, 227, 135, 0.4);
    }

    .btn-caregiver:hover {
      background-color: #f7da78;
    }
  </style>
</head>
<body>

  <div class="welcome-card">
    <!-- Sahara Exact Sprout Logo -->
    <div class="logo-container">
      <svg width="85" height="85" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Top Petal -->
        <path d="M50 7 C38 24 39 38 50 43 C61 38 62 24 50 7 Z" fill="#1F8EA7"/>
        <!-- Left Petal -->
        <path d="M27 42 C38 41 44 45 46.5 49 C46 62 45 74 47.5 84.5 C34 82.5 24.5 67 27 42 Z" fill="#1F8EA7"/>
        <!-- Right Petal -->
        <path d="M73 42 C62 41 56 45 53.5 49 C51 62 50 74 52.5 84.5 C66 82.5 75.5 67 73 42 Z" fill="#1F8EA7"/>
      </svg>
    </div>

    <!-- Headers -->
    <h1 class="title">Welcome to Sahara</h1>
    <p class="subtitle">Please select your role to<br>get started.</p>

    <!-- Role Selection Buttons -->
    <div class="button-group">
      <button class="btn btn-patient" id="btnPatient">
        <i class="fas fa-user icon"></i>
        <span>I am a Patient</span>
      </button>

      <button class="btn btn-caregiver" id="btnCaregiver">
        <i class="fas fa-hand-holding-heart icon"></i>
        <span>I am a Caregiver</span>
      </button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const btnPatient = document.getElementById("btnPatient");
      const btnCaregiver = document.getElementById("btnCaregiver");

      // Navigate to Patient Login / Registration page
      btnPatient.addEventListener("click", function () {
        window.location.href = "patient_login.html"; 
      });

      // Navigate to Caretaker Login / Registration page
      btnCaregiver.addEventListener("click", function () {
        window.location.href = "caretaker_login.html"; 
      });
    });
  </script>
</body>
</html>
